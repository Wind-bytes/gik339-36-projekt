<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilar</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <div class="container py-4">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3 mb-0">Bilar</h1>
        <button id="reload" class="btn btn-outline-secondary">
          Ladda om lista
        </button>
      </div>

      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <h2 class="h5 mb-2">Skapa / Uppdatera</h2>

          <p id="formMode" class="text-muted mb-3">Skapar ny bil</p>

          <form id="carForm" class="row g-2">
            <input id="id" type="hidden" />

            <div class="col-12 col-md-3">
              <input
                id="brand"
                class="form-control"
                placeholder="Märke"
                required
              />
            </div>

            <div class="col-12 col-md-3">
              <input
                id="regnr"
                class="form-control"
                placeholder="Regnr"
                required
              />
            </div>

            <div class="col-12 col-md-3">
              <input
                id="color"
                class="form-control"
                placeholder="Färg (t.ex. blue)"
                required
              />
            </div>

            <div class="col-12 col-md-2">
              <input
                id="year"
                class="form-control"
                type="number"
                placeholder="År (valfritt)"
              />
            </div>

            <div class="col-12 col-md-1 d-grid">
              <button id="saveBtn" type="submit" class="btn btn-primary">
                Spara
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- OBS: här finns INGEN lista från början, bara en container -->
      <div id="listContainer"></div>
    </div>

    <!-- Bootstrap Modal för meddelanden -->
    <div class="modal fade" id="msgModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="msgModalTitle">Meddelande</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Stäng"
            ></button>
          </div>
          <div class="modal-body" id="msgModalBody">...</div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-primary"
              data-bs-dismiss="modal"
            >
              OK
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Viktigt: bootstrap bundle FÖRE app.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
