<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilar</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body class="bg-primary bg-opacity-25">
    <div class="container py-4">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h1 class="h3 mb-0">Bilar</h1>
        <button id="reload" class="btn btn-outline-secondary">
          Ladda om lista
        </button>
      </div>

      <div class="card shadow-sm mb-3">
        <div class="card-body">
          <h2 class="h5 mb-2">Skapa / Uppdatera</h2>

          <p id="formMode" class="text-muted mb-3">Skapar ny bil</p>

          <form id="carForm" class="row g-2">
            <input id="id" type="hidden" />

            <div class="col-12 col-md-3">
              <select id="brand" class="form-select" required>
                <option value="">Välj bilmärke...</option>
              </select>
            </div>

            <div class="col-12 col-md-3">
              <input
                id="regnr"
                class="form-control"
                placeholder="Regnr"
                required
              />
            </div>

            <div class="col-12 col-md-3">
              <select id="color" class="form-select" required>
                <option value="">Välj färg...</option>
                <option value="Röd">Röd</option>
                <option value="Blå">Blå</option>
                <option value="Grön">Grön</option>
                <option value="Svart">Svart</option>
                <option value="Vit">Vit</option>
                <option value="Grå">Grå</option>
                <option value="Silver">Silver</option>
              </select>
            </div>

            <div class="col-12 col-md-2">
              <select id="year" class="form-select">
                <option value="">Välj år...</option>
              </select>
            </div>

            <div class="col-12 col-md-2 d-grid gap-2">
              <button id="saveBtn" type="submit" class="btn btn-primary">
                Spara
              </button>
              <button
                id="cancelBtn"
                type="button"
                class="btn btn-outline-secondary d-none"
              >
                Avbryt
              </button>
            </div>
            <div class="col-12">
              <div
                id="dropZone"
                class="border border-2 border-secondary rounded p-3 text-center bg-light"
              >
                <p class="mb-1 fw-semibold">Dra & släpp bild här</p>
                <p class="mb-2 text-muted small">
                  eller klicka för att välja (PNG / JPG)
                </p>

                <input
                  type="file"
                  id="imageInput"
                  accept="image/png, image/jpeg"
                  hidden
                />

                <img
                  id="imagePreview"
                  class="mt-2 d-none"
                  alt="Förhandsvisning"
                />

                <button
                  type="button"
                  id="removeImageBtn"
                  class="btn btn-sm btn-outline-danger mt-2 d-none"
                >
                  Ta bort bild
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
      <!-- OBS: här finns INGEN lista från början, bara en container -->
      <div class="mb-3">
        <label for="brandSearch" class="form-label">Sök (märke)</label>
        <input
          id="brandSearch"
          class="form-control"
          placeholder="Sök på bilmärke..."
        />
      </div>

      <div id="listContainer"></div>
    </div>

    <!-- Bootstrap Modal för meddelanden -->
    <div class="modal fade" id="msgModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="msgModalTitle">Meddelande</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Stäng"
            ></button>
          </div>
          <div class="modal-body" id="msgModalBody">...</div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-primary"
              data-bs-dismiss="modal"
            >
              OK
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Viktigt: bootstrap bundle FÖRE app.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./app.js"></script>
    <footer class="site-footer">

      <ul> 
       <p> Contact Morgan for support h24morgr@du.se</p>

      </li> 

      </ul>
    </footer>
  </body>
</html>
