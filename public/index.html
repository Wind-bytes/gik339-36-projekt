<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">
    <h1>Car Inventory</h1>

    <div class="card p-3 mb-4">
        <h3>Add/Edit Car</h3>
        <form id="carForm">
            <input type="hidden" id="carId">
            <div class="mb-2">
                <input type="text" id="brand" class="form-control" placeholder="Brand" required>
            </div>
            <div class="mb-2">
                <input type="text" id="model" class="form-control" placeholder="Model" required>
            </div>
            <div class="mb-2">
                <input type="text" id="color" class="form-control" placeholder="Color">
            </div>
            <div class="mb-2">
                <input type="number" id="year" class="form-control" placeholder="Year">
            </div>
            <button type="submit" class="btn btn-primary" id="saveBtn">Save Car</button>
        </form>
    </div>

    <h3>All Cars</h3>
    <ul id="carList" class="list-group"></ul>
    <div class="modal fade" id="feedbackModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Notice</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalMessage">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
