<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">🚗 Car Manager</span>
    </div>
</nav>

<div class="container">
    <div class="row">

        <!-- FORM -->
        <div class="col-md-4 mb-4">
            <h4>Add / Edit Car</h4>
            <form id="carForm">
                <input id="brand" class="form-control mb-2" placeholder="Brand" required>
                <input id="model" class="form-control mb-2" placeholder="Model" required>
                <input id="year" type="number" class="form-control mb-2" placeholder="Year" required>
                <button class="btn btn-primary w-100">Save</button>
            </form>
        </div>

        <!-- LIST -->
        <div class="col-md-8">
            <h4>Cars:</h4>
            <div id="carList" class="row gy-3"></div>
        </div>

    </div>
</div>

<!-- FEEDBACK MODAL -->
<div class="modal fade" id="feedbackModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body text-center" id="modalMessage"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
