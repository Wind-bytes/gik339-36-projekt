<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Manager Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        .car-card { transition: transform 0.2s; }
        .car-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold"><i class="bi bi-speedometer2 me-2"></i>Car Manager Pro</span>
    </div>
</nav>

<div class="container">
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm text-center p-3">
                <div class="text-muted small uppercase">Total Fleet</div>
                <h2 id="totalCars" class="fw-bold">0</h2>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card border-0 shadow-sm p-4">
                <h4 class="mb-3">Add / Edit Car</h4>
                <form id="carForm">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Brand</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-tag"></i></span>
                            <input id="brand" class="form-control" placeholder="e.g. Tesla" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Model</label>
                        <input id="model" class="form-control" placeholder="e.g. Model 3" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Year</label>
                        <input id="year" type="number" class="form-control" placeholder="e.g. 2024" required>
                    </div>
                    <button class="btn btn-primary w-100 fw-bold">
                        <i class="bi bi-plus-circle me-1"></i> Save Car
                    </button>
                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4>Your Garage</h4>
                <div class="input-group w-50">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                    <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search car...">
                </div>
            </div>
            
            <div id="carList" class="row gy-3">
                </div>
        </div>
    </div>
</div>

<div class="modal fade" id="feedbackModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-body text-center p-5">
                <i class="bi bi-check-circle-fill text-success display-4 mb-3"></i>
                <h4 id="modalMessage">Success!</h4>
                <button type="button" class="btn btn-light mt-3" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
